name: Dependency cache tests

on:
  push:
    paths:
      - 'scripts/dependency-release-cache.sh'
      - 'scripts/dependency-bundle.py'
      - 'scripts/dependency-libraries.json'
      - '.github/workflows/_build-deps.yml'
      - 'scripts/tests/**'
      - '.github/workflows/dependency-cache-tests.yml'
  pull_request:
    paths:
      - 'scripts/dependency-release-cache.sh'
      - 'scripts/dependency-bundle.py'
      - 'scripts/dependency-libraries.json'
      - '.github/workflows/_build-deps.yml'
      - 'scripts/tests/**'
      - '.github/workflows/dependency-cache-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test dependency cache transport offline
        run: python3 -m unittest discover -s scripts/tests -v
