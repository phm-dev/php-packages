        uses: actions/cache/restore@v4
        with:
          path: ${{ env.DEPS_CACHE_ROOT }}/librdkafka
          key: dep-librdkafka-${{ inputs.platform }}-${{ env.RECIPE_HASH }}
          restore-keys: ${{ env.RECIPE_HASH == '97973ea3ab9931a069f937fe352f527f68deff22d313ba05334b1adafef1083e' && format('dep-librdkafka-{0}-28200f8f217c05af28ebc23f477a9c2f3ff556bfa5f34c329b7f6984d98d9454', inputs.platform) || '' }}

      - name: Restore Actions cache [35/37] (libgearman)
        id: cache-libgearman
        if: steps.bundle.outputs.hit != 'true' && inputs.force_rebuild != true
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.DEPS_CACHE_ROOT }}/libgearman
          key: dep-libgearman-${{ inputs.platform }}-${{ env.RECIPE_HASH }}
          restore-keys: ${{ env.RECIPE_HASH == '97973ea3ab9931a069f937fe352f527f68deff22d313ba05334b1adafef1083e' && format('dep-libgearman-{0}-28200f8f217c05af28ebc23f477a9c2f3ff556bfa5f34c329b7f6984d98d9454', inputs.platform) || '' }}

      - name: Restore Actions cache [36/37] (imagemagick)
        id: cache-imagemagick
        if: steps.bundle.outputs.hit != 'true' && inputs.force_rebuild != true
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.DEPS_CACHE_ROOT }}/imagemagick
          key: dep-imagemagick-${{ inputs.platform }}-${{ env.RECIPE_HASH }}
          restore-keys: ${{ env.RECIPE_HASH == '97973ea3ab9931a069f937fe352f527f68deff22d313ba05334b1adafef1083e' && format('dep-imagemagick-{0}-28200f8f217c05af28ebc23f477a9c2f3ff556bfa5f34c329b7f6984d98d9454', inputs.platform) || '' }}

      - name: Restore Actions cache [37/37] (graphicsmagick)
        id: cache-graphicsmagick
        if: steps.bundle.outputs.hit != 'true' && inputs.force_rebuild != true
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.DEPS_CACHE_ROOT }}/graphicsmagick
          key: dep-graphicsmagick-${{ inputs.platform }}-${{ env.RECIPE_HASH }}
          restore-keys: ${{ env.RECIPE_HASH == '97973ea3ab9931a069f937fe352f527f68deff22d313ba05334b1adafef1083e' && format('dep-graphicsmagick-{0}-28200f8f217c05af28ebc23f477a9c2f3ff556bfa5f34c329b7f6984d98d9454', inputs.platform) || '' }}

      - name: Restore individual releases and migrate Actions cache
        id: individual
        if: steps.bundle.outputs.hit != 'true'
        run: python3 scripts/dependency-bundle.py prepare
        env:
          MATCHED_LIBFFI: ${{ steps.cache-libffi.outputs.cache-matched-key }}
          MATCHED_ZLIB: ${{ steps.cache-zlib.outputs.cache-matched-key }}
          MATCHED_BZIP2: ${{ steps.cache-bzip2.outputs.cache-matched-key }}
          MATCHED_LIBEDIT: ${{ steps.cache-libedit.outputs.cache-matched-key }}
          MATCHED_OPENSSL: ${{ steps.cache-openssl.outputs.cache-matched-key }}
          MATCHED_LIBICONV: ${{ steps.cache-libiconv.outputs.cache-matched-key }}
          MATCHED_ICU4C: ${{ steps.cache-icu4c.outputs.cache-matched-key }}
          MATCHED_ONIGURUMA: ${{ steps.cache-oniguruma.outputs.cache-matched-key }}
          MATCHED_LIBPNG: ${{ steps.cache-libpng.outputs.cache-matched-key }}
          MATCHED_JPEG_TURBO: ${{ steps.cache-jpeg-turbo.outputs.cache-matched-key }}
          MATCHED_FREETYPE: ${{ steps.cache-freetype.outputs.cache-matched-key }}
          MATCHED_WEBP: ${{ steps.cache-webp.outputs.cache-matched-key }}
          MATCHED_LIBSODIUM: ${{ steps.cache-libsodium.outputs.cache-matched-key }}
          MATCHED_LIBZIP: ${{ steps.cache-libzip.outputs.cache-matched-key }}
          MATCHED_LIBPQ: ${{ steps.cache-libpq.outputs.cache-matched-key }}
          MATCHED_LIBXML2: ${{ steps.cache-libxml2.outputs.cache-matched-key }}
          MATCHED_SQLITE: ${{ steps.cache-sqlite.outputs.cache-matched-key }}
          MATCHED_LIBXSLT: ${{ steps.cache-libxslt.outputs.cache-matched-key }}
          MATCHED_CURL: ${{ steps.cache-curl.outputs.cache-matched-key }}
          MATCHED_RABBITMQ_C: ${{ steps.cache-rabbitmq-c.outputs.cache-matched-key }}
          MATCHED_LIBEVENT: ${{ steps.cache-libevent.outputs.cache-matched-key }}
          MATCHED_ZSTD: ${{ steps.cache-zstd.outputs.cache-matched-key }}
          MATCHED_OSSP_UUID: ${{ steps.cache-ossp-uuid.outputs.cache-matched-key }}
          MATCHED_LIBYAML: ${{ steps.cache-libyaml.outputs.cache-matched-key }}
          MATCHED_LZ4: ${{ steps.cache-lz4.outputs.cache-matched-key }}
          MATCHED_LIBMAXMINDDB: ${{ steps.cache-libmaxminddb.outputs.cache-matched-key }}
          MATCHED_LUA: ${{ steps.cache-lua.outputs.cache-matched-key }}
          MATCHED_LIBEV: ${{ steps.cache-libev.outputs.cache-matched-key }}
          MATCHED_LIBSSH2: ${{ steps.cache-libssh2.outputs.cache-matched-key }}
          MATCHED_LIBMCRYPT: ${{ steps.cache-libmcrypt.outputs.cache-matched-key }}
          MATCHED_GMP: ${{ steps.cache-gmp.outputs.cache-matched-key }}
          MATCHED_LIBJUDY: ${{ steps.cache-libjudy.outputs.cache-matched-key }}
          MATCHED_LIBMEMCACHED: ${{ steps.cache-libmemcached.outputs.cache-matched-key }}
          MATCHED_LIBRDKAFKA: ${{ steps.cache-librdkafka.outputs.cache-matched-key }}
          MATCHED_LIBGEARMAN: ${{ steps.cache-libgearman.outputs.cache-matched-key }}
          MATCHED_IMAGEMAGICK: ${{ steps.cache-imagemagick.outputs.cache-matched-key }}
          MATCHED_GRAPHICSMAGICK: ${{ steps.cache-graphicsmagick.outputs.cache-matched-key }}

      - name: Install build tools once
        if: steps.individual.outputs.needs_build == 'true'
        run: brew install -q autoconf automake pkg-config libtool cmake bison flex

      - name: Build only missing dependencies in order
        if: steps.individual.outputs.needs_build == 'true'
        run: python3 scripts/dependency-bundle.py build

      - name: Publish complete dependency bundle to Releases
        run: python3 scripts/dependency-bundle.py save

      - name: Save complete Actions cache
        if: steps.bundle-actions.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.DEPS_PREFIX }}
          key: ${{ env.BUNDLE_KEY }}

      - name: Upload merged dependencies
        uses: actions/upload-artifact@v4
        with:
          name: deps-${{ inputs.platform }}
          path: ${{ env.DEPS_PREFIX }}
          retention-days: 7

      - name: Upload dependency logs and progress report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-logs-${{ inputs.platform }}
          path: ${{ env.DEPENDENCY_LOG_DIR }}
          if-no-files-found: ignore
          retention-days: 14
