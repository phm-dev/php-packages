          restore-keys: ${{ env.RECIPE_HASH == '97973ea3ab9931a069f937fe352f527f68deff22d313ba05334b1adafef1083e' && format('dep-zlib-{0}-28200f8f217c05af28ebc23f477a9c2f3ff556bfa5f34c329b7f6984d98d9454', inputs.platform) || '' }}

