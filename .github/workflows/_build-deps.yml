name: Build Dependencies (Reusable)

on:
  workflow_call:
    inputs:
      platform:
        description: 'Target platform (darwin-arm64 or darwin-amd64)'
        required: true
        type: string
      runner:
        description: 'GitHub Actions runner'
        required: true
        type: string
      debug:
        description: Show full dependency build output live
        required: false
        type: boolean
        default: false
      force_rebuild:
        description: 'Force rebuild even if cached'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  HOMEBREW_NO_ENV_HINTS: 1

jobs:
  dependencies:
    name: Restore or build all dependencies
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      DEP_PLATFORM: ${{ inputs.platform }}
      FORCE_REBUILD: ${{ inputs.force_rebuild }}
      DEPENDENCY_DEBUG: ${{ inputs.debug }}
    steps:
      - uses: actions/checkout@v4

      - name: Set cache identities
        run: |
          echo "DEPENDENCY_LOG_DIR=${RUNNER_TEMP}/dependency-logs" >> "$GITHUB_ENV"
          echo "DEPS_PREFIX=${RUNNER_TEMP}/phm-deps-bundle/${DEP_PLATFORM}" >> "$GITHUB_ENV"
          echo "DEPS_CACHE_ROOT=${RUNNER_TEMP}/phm-deps/${DEP_PLATFORM}" >> "$GITHUB_ENV"
          echo "RECIPE_HASH=${{ hashFiles('scripts/deps/*.sh') }}" >> "$GITHUB_ENV"
          echo "BUNDLE_KEY=deps-bundle-${{ inputs.platform }}-${{ hashFiles('scripts/deps/*.sh', 'scripts/dependency-libraries.json', 'scripts/dependency-bundle.py', 'scripts/dependency-release-cache.sh', 'scripts/relocate-dependencies.py') }}" >> "$GITHUB_ENV"

      - name: Restore complete Actions cache
        id: bundle-actions
        if: inputs.force_rebuild != true
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.DEPS_PREFIX }}
          key: ${{ env.BUNDLE_KEY }}

      - name: Validate complete cache or restore complete release
        id: bundle
        run: python3 scripts/dependency-bundle.py restore
        env:
          BUNDLE_MATCHED_KEY: ${{ steps.bundle-actions.outputs.cache-matched-key }}

      - name: Restore Actions cache [1/37] (libffi)
        id: cache-libffi
        if: steps.bundle.outputs.hit != 'true' && inputs.force_rebuild != true
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.DEPS_CACHE_ROOT }}/libffi
          key: dep-libffi-${{ inputs.platform }}-${{ env.RECIPE_HASH }}
          restore-keys: ${{ env.RECIPE_HASH == '97973ea3ab9931a069f937fe352f527f68deff22d313ba05334b1adafef1083e' && format('dep-libffi-{0}-28200f8f217c05af28ebc23f477a9c2f3ff556bfa5f34c329b7f6984d98d9454', inputs.platform) || '' }}

      - name: Restore Actions cache [2/37] (zlib)
        id: cache-zlib
        if: steps.bundle.outputs.hit != 'true' && inputs.force_rebuild != true
        uses: actions/cache/restore@v4
